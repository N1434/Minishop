<html lang="vi">

    <meta charset="UTF-8" />

    <title>Liên hệ</title>
  </head>
  <body>
    <header class="site-header">
      <h1>MiniShop</h1>
      <nav class="main-nav">

        <a href="about.html">Giới thiệu</a>

    <main>
      <h1>Liên hệ</h1>
      <form class="form">
        <label>Họ tên:</label>
        <input type="text" name="fullname" required />
        <br /><br />

        <label>Email:</label>
        <input type="email" name="email" required />
        <br /><br />

        <label>Tiêu đề:</label>
        <input type="text" name="subject" required />
        <br /><br />

        <label>Nội dung:</label>
        <br />
        <textarea name="message" rows="5" cols="40" required></textarea>
        <br /><br />

        <button type="submit" class="submit">Gửi</button>
      </form>
    </main>
  </body>
</html>
