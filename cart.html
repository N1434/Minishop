<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Giỏ hàng</title>
  </head>
  <body>
    <h1>Giỏ hàng</h1>

    <table class="cart-table" border="1" cellpadding="10">
      <tr>
        <th>Sản phẩm</th>
        <th>Đơn giá</th>
        <th>Số lượng</th>
        <th>Thành tiền</th>
      </tr>

      <tr>
        <td>Tai nghe Bluetooth</td>
        <td>2.450.000đ</td>
        <td><input type="number" min="1" value="1" /></td>
        <td>2.450.000đ</td>
      </tr>

      <tr>
        <td>Chuột không dây M1</td>
        <td>120.000đ</td>
        <td><input type="number" min="1" value="1" /></td>
        <td>120.000đ</td>
      </tr>

      <tr>
        <td colspan="3"><strong>Tổng tiền</strong></td>
        <td><strong>2.570.000đ</strong></td>
      </tr>
    </table>

    <br />
    <button type="button">Đặt hàng</button>
  </body>
</html>
